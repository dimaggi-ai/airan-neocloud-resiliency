[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airan-neocloud-resiliency"
version = "1.0.0"
description = "Monte Carlo resilience of the AI-RAN last mile: multi-transport bonding, power chains, GNSS holdover, and the price of a nine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Margaret Nanyonga" }]
keywords = ["ai-ran", "resilience", "availability", "leo", "starlink",
            "edge-computing", "neocloud", "monte-carlo", "telecom"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Telecommunications Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking",
]

[project.urls]
Repository = "https://github.com/dimaggi-ai/airan-neocloud-resiliency"

[project.scripts]
airan-resiliency = "resiliency.cli:main"

[project.optional-dependencies]
figures = ["matplotlib>=3.7"]

[tool.setuptools]
packages = ["resiliency"]
