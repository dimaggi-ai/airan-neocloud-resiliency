name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Validation registry (public outage stats + multi-seed Monte Carlo)
        run: python validation.py
      - name: CLI smoke
        run: |
          python -m resiliency.cli ladder --years 50
          python -m resiliency.cli policy -p P4 --years 50
          python -m resiliency.cli transports
